<div class="notification-stack" *ngIf="(notifications$ | async) as notifications">
  <div
    *ngFor="let notification of notifications; trackBy: trackById"
    class="toast"
    [ngClass]="variantClass(notification)"
  >
    <span class="toast__message">{{ notification.message }}</span>
    <button
      *ngIf="notification.dismissible"
      type="button"
      class="toast__close"
      (click)="dismiss(notification.id)"
      aria-label="Dismiss notification"
    >
      &times;
    </button>
  </div>
</div>
