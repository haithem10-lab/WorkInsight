<section class="auth-shell">
  <div class="card">
    <span class="badge">{{ text.badge }}</span>
    <div class="header">
      <h1>{{ text.title }}</h1>
      <p>{{ text.subtitle }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>{{ text.fields.fullNameLabel }}</span>
        <input type="text" [placeholder]="text.fields.fullNamePlaceholder" formControlName="fullName" />
        <small *ngIf="form.controls.fullName.invalid && form.controls.fullName.touched">
          {{ text.fields.fullNameError }}
        </small>
      </label>

      <label class="field">
        <span>{{ text.fields.emailLabel }}</span>
        <input type="email" [placeholder]="text.fields.emailPlaceholder" formControlName="email" />
        <small *ngIf="form.controls.email.invalid && form.controls.email.touched">
          {{ text.fields.emailError }}
        </small>
      </label>

      <label class="field">
        <span>{{ text.fields.passwordLabel }}</span>
        <input type="password" [placeholder]="text.fields.passwordPlaceholder" formControlName="password" />
        <small *ngIf="form.controls.password.invalid && form.controls.password.touched">
          {{ text.fields.passwordError }}
        </small>
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="agree" />
        <span>{{ text.agreeLabel }}</span>
      </label>

      <button type="submit" [disabled]="loading">
        {{ loading ? text.ctaLoading : text.cta }}
      </button>
    </form>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <div class="footer">
      <span>{{ text.footerPrompt }}</span>
      <a routerLink="/signin">{{ text.footerLink }}</a>
    </div>
  </div>
</section>
