<section class="auth-shell">
  <div class="card">
    <span class="badge">{{ text.badge }}</span>
    <div class="header">
      <h1>{{ text.title }}</h1>
      <p>{{ text.subtitle }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>{{ text.emailLabel }}</span>
        <input type="email" [placeholder]="text.emailPlaceholder" formControlName="email" />
        <small *ngIf="form.controls.email.invalid && form.controls.email.touched">{{ text.emailError }}</small>
      </label>

      <label class="field">
        <span>{{ text.passwordLabel }}</span>
        <input type="password" [placeholder]="text.passwordPlaceholder" formControlName="password" />
        <small *ngIf="form.controls.password.invalid && form.controls.password.touched">
          {{ text.passwordError }}
        </small>
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="remember" />
        <span>{{ text.remember }}</span>
      </label>

      <div class="forgot-link">
        <a routerLink="/forgot-password">{{ text.forgot }}</a>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? text.ctaLoading : text.cta }}
      </button>
    </form>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <div class="footer">
      <span>{{ text.footerPrompt }}</span>
      <a routerLink="/signup">{{ text.footerLink }}</a>
    </div>
  </div>
</section>
