<section class="auth-shell">
  <div class="card">
    <span class="badge">{{ text.badge }}</span>
    <div class="header">
      <h1>{{ text.title }}</h1>
      <p>{{ text.subtitle }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>{{ text.fields.passwordLabel }}</span>
        <input type="password" [placeholder]="text.fields.passwordPlaceholder" formControlName="password" />
        <small *ngIf="form.controls.password.invalid && form.controls.password.touched">
          {{ text.fields.passwordError }}
        </small>
      </label>

      <label class="field">
        <span>{{ text.fields.confirmLabel }}</span>
        <input type="password" [placeholder]="text.fields.confirmPlaceholder" formControlName="confirm" />
        <small *ngIf="confirmErrorVisible">
          {{ text.fields.confirmError }}
        </small>
      </label>

      <button type="submit" [disabled]="loading || !token">
        {{ loading ? text.ctaLoading : text.cta }}
      </button>
    </form>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success">{{ successMessage }}</p>

    <div class="footer">
      <span>{{ text.footerPrompt }}</span>
      <a routerLink="/signin">{{ text.footerLink }}</a>
    </div>
  </div>
</section>
