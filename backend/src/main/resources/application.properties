spring.application.name=workinsight
server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/workinsight
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# OCR configuration (ensure Tesseract is installed and TESSDATA_PREFIX or the explicit path is set)
ocr.enabled=true
#ocr.tesseract.data-path=C:/Program Files/Tesseract-OCR/tessdata
ocr.tesseract.language=eng
ocr.max-pages=3

# Optional AI enhancements (disabled when api-key is empty)
# Load your key from the AI_OPENAI_API_KEY environment variable.
ai.openai.api-key=${AI_OPENAI_API_KEY:}
ai.openai.base-url=https://api.openai.com/v1
ai.openai.text-model=gpt-4o-mini
ai.openai.vision-model=gpt-4o-mini

# Geocoding
geocoding.nominatim.enabled=true
